<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Global Time</h1>
        <p class="subtitle">Current Time Across Time Zones</p>

        <div class="controls">
            <label for="timezone-select">Add Timezone:</label>
            <select id="timezone-select">
                <option value="">-- Select a Timezone --</option>
            </select>
            <button id="add-btn">Add</button>
            <button id="reset-btn">Reset to Default</button>
        </div>

        <div class="clocks-container" id="clocks-container">
            <!-- Clock cards will be inserted here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
